[package]
name = "svtoggle"
version = "0.3.1"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
svtoggle-core = { path = "../core" }
tray-icon = "0.26.1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
earcutr = "0.5.0"
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"

# the admin manifest makes this bin's test harness need elevation (os error 740); it has no tests anyway
[[bin]]
name = "svtoggle-gui"
path = "src/bin/svtoggle-gui.rs"
test = false
